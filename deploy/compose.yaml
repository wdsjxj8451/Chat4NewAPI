services:
  chat:
    image: ${CHAT_IMAGE:?Set CHAT_IMAGE}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3100
      APP_DATA_DIR: /app/data
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY}
      SETUP_TOKEN: ${SETUP_TOKEN:?Set SETUP_TOKEN}
      DEFAULT_MODEL_API_URL: ${DEFAULT_MODEL_API_URL:-}
    volumes:
      - ./data/chat:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app
      - models

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      CHAT_DOMAIN: ${CHAT_DOMAIN:?Set CHAT_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - chat
    networks:
      - app

networks:
  app:
    driver: bridge
  models:
    name: chat4newapi-models
    external: true

volumes:
  caddy_data:
  caddy_config:
